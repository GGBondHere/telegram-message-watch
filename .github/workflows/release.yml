name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            asset: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            asset: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: ${{ matrix.arch }}
      GOAMD64: v1
      GOARM64: v8.0
      REPOSITORY: ${{ github.repository }}
      ASSET: tgw-linux-${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.3'
          cache: true
      - name: Build native binary
        run: |
          mkdir -p artifacts
          go build -p 2 -trimpath -ldflags "-s -w -X main.repository=$REPOSITORY" -o "artifacts/$ASSET" ./src
      - name: Generate third-party notices
        if: matrix.arch == 'amd64'
        run: python3 .github/notices.py --output artifacts/THIRD_PARTY_NOTICES.md --binary "artifacts/$ASSET"
      - name: Verify binary version
        run: |
          version=$("./artifacts/$ASSET" --version)
          "./artifacts/$ASSET" --self-check
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]]
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify complete release assets
        working-directory: artifacts
        run: |
          for asset in tgw-linux-x86_64 tgw-linux-aarch64; do
            [[ -s "$asset" ]]
          done
          [[ -s THIRD_PARTY_NOTICES.md ]]
      - name: Read version changelog
        shell: bash
        run: |
          set -euo pipefail
          awk -v version="${GITHUB_REF_NAME#v}" '
            { sub(/\r$/, "") }
            /^## / {
              matched = ($2 == "[" version "]")
              if (matched) count++
              active = (matched && NF == 4 && $3 == "-")
              next
            }
            active {
              print
              if ($0 ~ /^[[:space:]]*[^#[:space:]]/) content = 1
            }
            END {
              if (count != 1 || !content) {
                print "CHANGELOG.md 中版本 " version " 必须唯一、标题格式正确且正文非空" > "/dev/stderr"
                exit 1
              }
            }
          ' CHANGELOG.md > release-notes.md
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(artifacts/tgw-linux-x86_64 artifacts/tgw-linux-aarch64 artifacts/THIRD_PARTY_NOTICES.md)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
